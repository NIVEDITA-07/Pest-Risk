# Render Blueprint specification for PestRisk
services:
  - type: web
    name: pestrisk-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: PESTRISK_ADMIN_USERNAME
        value: ADMIN-01
      - key: PESTRISK_ADMIN_PASSWORD
        generateValue: true
      - key: PESTRISK_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
