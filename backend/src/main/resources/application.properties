server.port=${PORT:8080}
spring.application.name=PestRisk

# CORS configuration (supports localhost, 127.0.0.1, and cloud frontend deployments like Vercel)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database configuration: Defaults to file-based SQLite on D: drive for local development
# On cloud platforms (Render/Docker), pass DB_URL (e.g. jdbc:sqlite:/app/data/pestrisk.db or PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:sqlite:${DB_PATH:D:/uhv/data/pestrisk.db}}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate settings (Dialect dynamically resolved by DatabaseDialectConfig based on DB_URL)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# PestRisk Security & JWT configuration: PESTRISK_JWT_SECRET is mandatory outside test profile
pestrisk.admin.username=${PESTRISK_ADMIN_USERNAME:ADMIN-01}
pestrisk.admin.password=${PESTRISK_ADMIN_PASSWORD:AdminPassword123}
pestrisk.jwt.secret=${PESTRISK_JWT_SECRET:}
pestrisk.jwt.expiration-seconds=${PESTRISK_JWT_EXPIRATION_SECONDS:7200}

