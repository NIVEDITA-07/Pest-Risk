# Test Datasource: Isolated in-memory H2 database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:pestrisk_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate test configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Test security settings
pestrisk.admin.username=admin
pestrisk.admin.password=TestAdminSecret2026!LongPassword
pestrisk.jwt.secret=TestJwtSecretKeyForPestRiskAutomatedTestsMustBe256BitsLong2026!
pestrisk.jwt.expiration-seconds=3600
